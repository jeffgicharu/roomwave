name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time. A newer push waits for the running deploy to finish.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roomwave
          POSTGRES_PASSWORD: roomwave
          POSTGRES_DB: roomwave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roomwave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://roomwave:roomwave@127.0.0.1:5432/roomwave_test
      REDIS_URL: redis://127.0.0.1:6379/3
      REDIS_PREFIX: "roomwave-test:"
      SITE_URL: http://localhost:5173
      APP_SECRET: settings-for-the-test-run-only-0123456789
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

  build:
    name: Build
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # The marketing site, the app's static files, and the bundled server
      # with only its production packages (no optional native add-ons: the
      # production processor cannot run them).
      - name: Assemble the release
        env:
          RELEASE: ${{ github.sha }}
        run: |
          node scripts/assemble-release.mjs
          tar -C release -czf release.tar.gz .

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to roomwave.jeffgicharu.com
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: production
      url: https://roomwave.jeffgicharu.com
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release

      - run: mkdir release && tar -xzf release.tar.gz -C release

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_ACTIVATE_SSH_KEY: ${{ secrets.VPS_ACTIVATE_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/upload_key
          printf '%s\n' "$VPS_ACTIVATE_SSH_KEY" > ~/.ssh/activate_key
          chmod 600 ~/.ssh/upload_key ~/.ssh/activate_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The upload key is limited to rsync into the releases directory, so the
      # remote path is relative to that directory.
      - name: Upload the release
        run: |
          rsync -az --delete --delay-updates \
            -e "ssh -i ~/.ssh/upload_key -o IdentitiesOnly=yes" \
            release/ "$VPS_USER@$VPS_HOST:./$GITHUB_SHA/"

      # The activate key can run one script on the server and nothing else. It
      # migrates the database, starts the release beside the live one, makes it
      # pass a real live session there, and only then sends visitors to it.
      - name: Activate the release
        run: ssh -i ~/.ssh/activate_key -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "$GITHUB_SHA"

      - name: Check the live site serves this release
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSI https://roomwave.jeffgicharu.com/api/health | grep -qi "^x-release: $GITHUB_SHA"; then
              echo "roomwave.jeffgicharu.com is serving ${GITHUB_SHA::7}"
              exit 0
            fi
            sleep 5
          done
          echo "roomwave.jeffgicharu.com is not serving ${GITHUB_SHA::7}"
          exit 1

      # From outside, through Cloudflare, as a visitor arrives.
      - name: Check the pages load
        run: |
          for path in / /features /pricing /use-cases /use-cases/conferences /help /help/first-session /about /contact /join /signin /app /sitemap-index.xml /robots.txt; do
            for attempt in 1 2 3; do
              status=$(curl -sS -o /dev/null -w '%{http_code}' -A "Mozilla/5.0 (deploy check)" "https://roomwave.jeffgicharu.com$path") && break
              status=000
              sleep 2
            done
            echo "$status $path"
            [ "$status" = "200" ] || failed=1
          done
          [ -z "${failed:-}" ]
