# roomwave.jeffgicharu.com
# Installed as /etc/nginx/sites-available/roomwave.jeffgicharu.com by deploy/provision.sh.

# The server runs in one of two slots. The file included here names the live
# one, and it is the only thing a release changes in nginx.
upstream roomwave_web {
    include /etc/nginx/roomwave/upstream.conf;
    keepalive 16;
}

# Live connections ask to be upgraded to WebSockets; other requests keep the
# upstream connection open for reuse.
map $http_upgrade $roomwave_connection {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name roomwave.jeffgicharu.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name roomwave.jeffgicharu.com;

    server_tokens off;
    charset utf-8;

    # Cloudflare origin certificate, shared by every site on this server.
    ssl_certificate /etc/ssl/cloudflare/jeffgicharu.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jeffgicharu.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/roomwave.access.log;
    error_log /var/log/nginx/roomwave.error.log;

    # The visitor's address comes from Cloudflare's header, and only when the
    # connection comes from Cloudflare. Ranges from https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    root /var/www/roomwave.jeffgicharu.com/current/public;

    # Every page asks search engines not to list it.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://roomwave.jeffgicharu.com https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/json application/manifest+json application/javascript application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;

    error_page 404 /404.html;
    # If the server cannot answer, visitors get Roomwave's own page.
    error_page 502 503 504 /unavailable.html;
    location = /unavailable.html {
        root /var/www/roomwave.jeffgicharu.com/shared/pages;
        internal;
    }

    location /api/ {
        limit_req zone=general burst=60 nodelay;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_pass http://roomwave_web;
    }

    # Live connections. A whole hall often shares one public address, so there
    # is no per-address limit here; the server limits each connection itself.
    # Pings every 25 seconds keep a connection well inside this timeout.
    location /socket.io/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $roomwave_connection;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
        proxy_pass http://roomwave_web;
    }

    # Scripts, styles and fonts carry a fingerprint in their names and never
    # change. They are kept for every release still on disk, so a page from the
    # release before can still load what it needs.
    location /_app/immutable/ {
        root /var/www/roomwave.jeffgicharu.com/shared/static;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location /_astro/ {
        root /var/www/roomwave.jeffgicharu.com/shared/static;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location /media/ {
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # The app's screens are all drawn in the browser from one shell page.
    location ~ ^/(app|present|remote|staff|signin|signup|forgot-password|reset-password|try|join)(/.*)?$ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://roomwave.jeffgicharu.com https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files /app-shell.html =404;
    }

    # The audience's short address: a six-digit code.
    location ~ "^/[1-9][0-9]{5}$" {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://roomwave.jeffgicharu.com https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files /app-shell.html =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://roomwave.jeffgicharu.com https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/index.html =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
